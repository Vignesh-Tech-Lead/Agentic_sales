openapi: 3.1.0
info:
  title: Agentic Sales Automation API
  version: 1.0.0
  description: Starter contract; expand every endpoint before implementation.
servers:
  - url: https://api.example.invalid/api/v1
paths:
  /leads:
    get:
      summary: List authorized leads
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Authorized lead page
    post:
      summary: Create a lead
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 150 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact_name, source_id]
              properties:
                contact_name: { type: string, maxLength: 150 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 30 }
                company_name: { type: string, maxLength: 200 }
                source_id: { type: string, format: uuid }
                service_id: { type: string, format: uuid }
                requirement: { type: string, maxLength: 10000 }
                budget_amount: { type: number, minimum: 0 }
                currency: { type: string, minLength: 3, maxLength: 3 }
      responses:
        "201": { description: Lead created }
        "400": { description: Validation error }
        "409": { description: Idempotency or conflict }
  /public/forms/{slug}/submit:
    post:
      summary: Submit an owned public lead form
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202": { description: Submission accepted for processing }
        "400": { description: Invalid form submission }
        "429": { description: Rate limited }
  /agent-executions/{execution_id}:
    get:
      summary: Get agent execution status
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: execution_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Execution status and safe output }
        "404": { description: Not found or not authorized }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
